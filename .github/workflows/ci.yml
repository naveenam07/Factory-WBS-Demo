name: CI

on:
  pull_request:
  push:
    branches: [main1]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: make install

      - name: Unit tests with coverage
        run: make test
