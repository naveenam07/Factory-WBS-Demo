[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wavebank-trading-app"
version = "0.1.0"
description = "WaveBank Advisor Trading App (fictional demo service)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "jinja2==3.1.6",
    "pymongo==4.20.0",
    "requests==2.28.2",
]

[project.optional-dependencies]
dev = [
    "mongomock==4.3.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.3",
    "httpx==0.28.1",
    "pytest-playwright==0.10.0",
    "playwright==1.65.1",
    "ruff==0.17.5",
]

[dependency-groups]
# pip-audit needs a newer requests than the app pins, so it is installed into its own
# virtualenv by `make audit` (pip install --group audit) instead of the dev extras.
audit = ["pip-audit==2.10.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
