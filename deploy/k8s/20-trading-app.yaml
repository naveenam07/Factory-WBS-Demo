apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-app
  namespace: wavebank
  labels:
    app: trading-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trading-app
  template:
    metadata:
      labels:
        app: trading-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: trading-app
          image: wavebank/trading-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trading-app
  namespace: wavebank
  labels:
    app: trading-app
spec:
  type: NodePort
  selector:
    app: trading-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
